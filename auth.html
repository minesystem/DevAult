
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08090f">
    <title>Login / Sign Up — DevVault</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <main class="auth-page">
        <div class="auth-container">

            <a href="index.html" class="brand auth-brand">
                <img src="assets/logo.svg" alt="DevVault" width="180">
            </a>

            <div class="auth-card">
                <div class="auth-heading">
                    <span class="hero-badge">DEVELOPER COMMUNITY</span>
                    <h1 id="authTitle">Welcome back.</h1>
                    <p id="authSubtitle">Log in to continue your developer journey.</p>
                </div>

                <div class="auth-tabs">
                    <button type="button" id="loginTab" class="auth-tab active">
                        Log In
                    </button>
                    <button type="button" id="signupTab" class="auth-tab">
                        Create Account
                    </button>
                </div>

                <form id="authForm">
                    <div id="nameGroup" class="auth-field" hidden>
                        <label for="displayName">Display name</label>
                        <input
                            id="displayName"
                            type="text"
                            placeholder="Your display name"
                            maxlength="40"
                            autocomplete="name"
                        >
                    </div>

                    <div class="auth-field">
                        <label for="email">Email address</label>
                        <input
                            id="email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input
                                id="password"
                                type="password"
                                placeholder="Enter your password"
                                minlength="8"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" id="togglePassword">
                                Show
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submitButton" class="primary-btn auth-submit">
                        Log In →
                    </button>

                    <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
                </form>

                <p class="auth-switch">
                    <span id="switchText">Don't have an account?</span>
                    <button type="button" id="switchMode">Sign up</button>
                </p>

                <p class="auth-back">
                    <a href="index.html">← Back to homepage</a>
                </p>
            </div>

            <p class="auth-footer">
                Build. Share. Connect.
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        const supabaseClient = window.devVaultSupabase;

        const authForm = document.getElementById("authForm");
        const authTitle = document.getElementById("authTitle");
        const authSubtitle = document.getElementById("authSubtitle");
        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const nameGroup = document.getElementById("nameGroup");
        const displayName = document.getElementById("displayName");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const submitButton = document.getElementById("submitButton");
        const authMessage = document.getElementById("authMessage");
        const switchText = document.getElementById("switchText");
        const switchMode = document.getElementById("switchMode");
        const togglePassword = document.getElementById("togglePassword");

        let mode = "login";

        function showMessage(message, type = "error") {
            authMessage.textContent = message;
            authMessage.className = "auth-message " + type;
        }

        function setMode(newMode) {
            mode = newMode;
            authForm.reset();
            showMessage("");

            const isSignup = mode === "signup";

            authTitle.textContent = isSignup
                ? "Join DevVault."
                : "Welcome back.";

            authSubtitle.textContent = isSignup
                ? "Create your developer account."
                : "Log in to continue your developer journey.";

            nameGroup.hidden = !isSignup;
            displayName.required = isSignup;

            password.autocomplete = isSignup
                ? "new-password"
                : "current-password";

            submitButton.textContent = isSignup
                ? "Create Account →"
                : "Log In →";

            loginTab.classList.toggle("active", !isSignup);
            signupTab.classList.toggle("active", isSignup);

            switchText.textContent = isSignup
                ? "Already have an account?"
                : "Don't have an account?";

            switchMode.textContent = isSignup
                ? "Log in"
                : "Sign up";
        }

        loginTab.addEventListener("click", () => setMode("login"));
        signupTab.addEventListener("click", () => setMode("signup"));

        switchMode.addEventListener("click", () => {
            setMode(mode === "login" ? "signup" : "login");
        });

        togglePassword.addEventListener("click", () => {
            const showing = password.type === "text";
            password.type = showing ? "password" : "text";
            togglePassword.textContent = showing ? "Show" : "Hide";
        });

        authForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            showMessage("");

            if (!supabaseClient) {
                showMessage("Supabase failed to load. Check your connection file.");
                return;
            }

            const emailValue = email.value.trim();
            const passwordValue = password.value;
            const nameValue = displayName.value.trim();

            if (mode === "signup" && nameValue.length < 2) {
                showMessage("Display name must contain at least 2 characters.");
                return;
            }

            if (passwordValue.length < 8) {
                showMessage("Password must contain at least 8 characters.");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Please wait...";

            try {
                if (mode === "signup") {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: emailValue,
                        password: passwordValue,
                        options: {
                            data: {
                                display_name: nameValue
                            },
                            emailRedirectTo: window.location.origin + "/auth.html"
                        }
                    });

                    if (error) throw error;

                    if (data.session) {
                        window.location.href = "dashboard.html";
                    } else {
                        showMessage(
                            "Account created! Check your email for the confirmation link.",
                            "success"
                        );
                    }
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: emailValue,
                        password: passwordValue
                    });

                    if (error) throw error;

                    if (data.session) {
                        window.location.href = "dashboard.html";
                    }
                }
            } catch (error) {
                showMessage(error.message || "Something went wrong. Please try again.");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = mode === "signup"
                    ? "Create Account →"
                    : "Log In →";
            }
        });

        if (supabaseClient) {
            supabaseClient.auth.getSession().then(({ data, error }) => {
                if (!error && data.session) {
                    window.location.href = "dashboard.html";
                }
            });
        } else {
            showMessage("Supabase connection unavailable. Check js/supabase.js.");
        }
    </script>
</body>
</html>
